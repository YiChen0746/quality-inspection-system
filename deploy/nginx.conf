# 合同质检系统 —— Nginx 站点配置
#
# 使用方法（Ubuntu/Debian）：
#   1. 把本文件上传为 /etc/nginx/sites-available/quality-inspection
#   2. 启用站点：ln -s /etc/nginx/sites-available/quality-inspection /etc/nginx/sites-enabled/
#   3. 删除默认站点（可选，避免抢占 80 端口）：rm -f /etc/nginx/sites-enabled/default
#   4. 校验并重载：nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;                       # 用公网 IP 访问时保持 _ 即可；以后有域名再改成域名

    # 前端打包产物 dist 的上传位置
    root /var/www/quality-inspection/dist;
    index index.html;

    # 合同文件可能较大，放宽请求体体积限制（后端 multer 也要能接受）
    client_max_body_size 50m;

    # 前端页面：Vue Router 使用 history 模式，刷新子路径必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 多智能体庭审的流式通道：必须关闭代理缓冲，否则前端会等整段结束才一次性收到，
    # 虚拟法庭就无法逐条播放（后端已带 X-Accel-Buffering: no，这里再显式关闭更稳）
    location /api/multi-agent/review-stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 一场庭审可能持续 2-3 分钟，超时要留足
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 后端接口（前端代码里的 /api/xxx 全部由这里转给 Node 服务）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 智能质检要调大模型，耗时较长，放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 后端静态资源与上传文件（头像、上传的合同、生成的报告等）
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
