<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同文书智能审核系统 - 邮箱验证</title>
  <!-- 引入Element UI -->
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background-color: #ecf0f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 500px;
      padding: 40px;
      background-color: #ecf0f3;
      border-radius: 12px;
      box-shadow: 10px 10px 10px #d1d9e6, -10px -10px 10px #f9f9f9;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #181818;
      text-align: center;
    }
    .description {
      margin-bottom: 30px;
      font-size: 16px;
      line-height: 1.6;
      text-align: center;
      color: #555;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      color: #333;
    }
    input {
      width: 100%;
      height: 40px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #ecf0f3;
      box-shadow: inset 2px 2px 4px #d1d9e6, inset -2px -2px 4px #f9f9f9;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      box-shadow: inset 4px 4px 4px #d1d9e6, inset -4px -4px 4px #f9f9f9;
    }
    .button-group {
      display: flex;
      justify-content: space-between;
    }
    button {
      flex: 1;
      height: 50px;
      border-radius: 25px;
      margin-top: 10px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
      background-color: #4B70E2;
      color: #f9f9f9;
      box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #f9f9f9;
      border: none;
      outline: none;
      cursor: pointer;
    }
    button:hover {
      box-shadow: 6px 6px 10px #d1d9e6, -6px -6px 10px #f9f9f9;
      transform: scale(0.985);
      transition: 0.25s;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #send-code-btn {
      margin-right: 10px;
    }
    #verify-code-btn {
      margin-left: 10px;
    }
    .countdown {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
      text-align: center;
    }
    .error-text {
      color: #F56C6C;
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>邮箱验证</h1>
      <p class="description">
        请输入您收到的验证码以完成注册。验证码已发送至您的邮箱，有效期为10分钟。
      </p>
      
      <div class="form-group">
        <label for="email">邮箱地址</label>
        <input type="email" id="email" v-model="email" readonly>
      </div>
      
      <div class="form-group">
        <label for="verification-code">验证码</label>
        <input type="text" id="verification-code" v-model="code" placeholder="请输入6位验证码">
        <div class="error-text" v-if="codeError">{{ codeError }}</div>
      </div>
      
      <div class="button-group">
        <button id="send-code-btn" @click="sendVerificationCode" :disabled="isCountingDown || sendLoading">
          {{ sendLoading ? '发送中...' : (isCountingDown ? `${countdown}秒后可重发` : '发送验证码') }}
        </button>
        <button id="verify-code-btn" @click="verifyCode" :disabled="verifyLoading">
          {{ verifyLoading ? '验证中...' : '验证' }}
        </button>
      </div>
    </div>
  </div>

  <!-- 引入Vue和Element UI -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          email: '',
          code: '',
          codeError: '',
          countdown: 0,
          timer: null,
          isCountingDown: false,
          sendLoading: false,
          verifyLoading: false
        };
      },
      mounted() {
        // 获取URL参数中的邮箱
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        if (email) {
          this.email = email;
          // 自动发送验证码
          this.sendVerificationCode();
        } else {
          this.$message.error('缺少邮箱参数');
          setTimeout(() => {
            window.location.href = '/api/login';
          }, 1500);
        }
      },
      methods: {
        // 开始倒计时
        startCountdown() {
          this.countdown = 60;
          this.isCountingDown = true;
          
          this.timer = setInterval(() => {
            this.countdown--;
            
            if (this.countdown <= 0) {
              clearInterval(this.timer);
              this.isCountingDown = false;
            }
          }, 1000);
        },
        // 发送验证码
        sendVerificationCode() {
          if (!this.email) {
            this.$message.error('缺少邮箱参数');
            return;
          }
          
          this.sendLoading = true;
          
          fetch('/api/sendCode', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email: this.email })
          })
          .then(response => response.json())
          .then(data => {
            this.sendLoading = false;
            
            if (data.err_code === 0) {
              this.$message.success('验证码已发送，请查收邮件');
              this.startCountdown();
            } else {
              this.$message.error(data.message || '发送验证码失败');
            }
          })
          .catch(error => {
            this.sendLoading = false;
            console.error('发送验证码请求失败:', error);
            this.$message.error('网络错误，请稍后重试');
          });
        },
        // 验证验证码
        verifyCode() {
          if (!this.code) {
            this.codeError = '请输入验证码';
            return;
          } else if (this.code.length !== 6) {
            this.codeError = '请输入6位验证码';
            return;
          } else {
            this.codeError = '';
          }
          
          this.verifyLoading = true;
          
          fetch('/api/sureCode', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              email: this.email,
              code: this.code
            })
          })
          .then(response => response.json())
          .then(data => {
            this.verifyLoading = false;
            
            if (data.err_code === 0) {
              this.$message.success('邮箱验证成功');
              setTimeout(() => {
                window.location.href = '/api/login';
              }, 1500);
            } else if (data.err_code === 1) {
              this.codeError = data.message || '验证码错误';
            } else {
              this.$message.error(data.message || '验证失败');
            }
          })
          .catch(error => {
            this.verifyLoading = false;
            console.error('验证请求失败:', error);
            this.$message.error('网络错误，请稍后重试');
          });
        }
      },
      beforeDestroy() {
        // 清除定时器
        if (this.timer) {
          clearInterval(this.timer);
        }
      }
    });
  </script>
</body>
</html>
